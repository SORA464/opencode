name: cert
on:
  workflow_dispatch:

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            ext: ""
          - os: macos-14
            target: darwin-arm64
            ext: ""
          - os: windows-2025
            target: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
        with:
          ref: harden-production
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Typecheck product chain
        run: |
          cd packages/core && bun run typecheck
          cd ../opencode && bun run typecheck
          cd ../tui && bun run typecheck
      - name: Core unit tests
        working-directory: packages/core
        run: bun test --timeout 60000
      - name: Build release binary (single target)
        working-directory: packages/opencode
        run: bun run build --single
      - name: Binary smoke + headless serve health
        working-directory: packages/opencode
        shell: bash
        run: |
          set -e
          BIN="dist/opencode-${{ matrix.target }}/bin/opencode${{ matrix.ext }}"
          echo "binary: $BIN"
          VERSION=$("$BIN" --version)
          echo "version: $VERSION"
          mkdir -p /tmp/certproj && cd /tmp/certproj
          PORT=46430
          "$GITHUB_WORKSPACE/packages/opencode/$BIN" serve --port "$PORT" --hostname 127.0.0.1 > /tmp/serve.log 2>&1 &
          SPID=$!
          OK=0
          for i in $(seq 1 90); do
            curl -sf "http://127.0.0.1:$PORT/global/health" -o /tmp/health.json 2>/dev/null && OK=1 && break
            sleep 1
          done
          cat /tmp/health.json || true
          [ "$OK" = "1" ] || { cat /tmp/serve.log; kill "$SPID" 2>/dev/null || true; exit 1; }
          grep -q '"healthy":true' /tmp/health.json
          kill "$SPID" 2>/dev/null || true
          {
            echo "### platform ${{ matrix.os }} (${{ matrix.target }})"
            echo "- version: PASS"
            echo "- install/typecheck/tests/build/serve-health: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
        with:
          ref: harden-production
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Desktop renderer/main compile (electron-vite build)
        working-directory: packages/desktop
        run: bun run build
      - name: Summary
        shell: bash
        run: |
          echo "desktop-build ${{ matrix.os }} : PASS" >> "$GITHUB_STEP_SUMMARY"
